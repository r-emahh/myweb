<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141a2e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Logo Mark -->
  <g transform="translate(120, 180) scale(4.5)">
    <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#text-grad)" />
    <path d="M10 8h7a5 5 0 0 1 5 5c0 2.76-2.24 5-5 5h-4v6h-3V8zm3 3v4h4a2 2 0 1 0 0-4h-4z" fill="#ffffff" />
    <circle cx="23" cy="23" r="2.2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="300" y="240" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif, -apple-system" font-size="54" font-weight="800" letter-spacing="-0.02em">株式会社pop</text>
  <text x="300" y="300" fill="url(#text-grad)" font-family="'Plus Jakarta Sans', sans-serif, -apple-system" font-size="42" font-weight="700">POP制作所</text>

  <text x="120" y="420" fill="#f3f4f6" font-family="'Plus Jakarta Sans', sans-serif, -apple-system" font-size="34" font-weight="700">Webサイト制作・UI/UXデザイン</text>
  <text x="120" y="475" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif, -apple-system" font-size="24">魅力を最大限に引き出すクリエイティブスタジオ</text>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#text-grad)" />
</svg>
